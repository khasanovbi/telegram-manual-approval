version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      groups:
          actions-minor:
              update-types:
                  - minor
                  - patch
      ignore:
          # Actions are pinned to floating major tags, so minor/patch bumps
          # would only replace `@v4` with a narrower `@v4.x.y` pin.
          - dependency-name: github/codeql-action
            update-types:
                - version-update:semver-minor
                - version-update:semver-patch

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      groups:
          npm-development:
              dependency-type: development
              update-types:
                  - minor
                  - patch
          npm-production:
              dependency-type: production
              update-types:
                  - patch
      ignore:
          # The action runs on the `node24` runtime, so the types must not run
          # ahead of it. Drop this once `runs.using` in action.yml moves up.
          - dependency-name: '@types/node'
            update-types:
                - version-update:semver-major
